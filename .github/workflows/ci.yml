name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
