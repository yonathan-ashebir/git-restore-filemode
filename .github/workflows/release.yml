name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0
      publish_pypi:
        description: Publish to PyPI with trusted publishing
        type: boolean
        required: true
        default: false
      publish_npm:
        description: Publish to npm with trusted publishing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_target: x86_64-unknown-linux
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            apt: musl-tools
          - asset_target: aarch64-unknown-linux
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            apt: musl-tools
          - asset_target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
          - asset_target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            runner: macos-15
          - asset_target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
          - asset_target: aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add "${{ matrix.rust_target }}"

      - name: Install Linux target dependencies
        if: ${{ matrix.apt != null && matrix.apt != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Test
        shell: bash
        run: cargo test --locked --target "${{ matrix.rust_target }}"

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Verify static Linux binary
        if: ${{ endsWith(matrix.asset_target, '-unknown-linux') }}
        shell: bash
        run: |
          binary="target/${{ matrix.rust_target }}/release/git-restore-filemode"
          ldd_output="$(ldd "${binary}" 2>&1 || true)"
          if printf '%s\n' "${ldd_output}" | grep -Eiq 'not a dynamic executable|statically linked'; then
            exit 0
          fi

          file "${binary}"
          printf '%s\n' "${ldd_output}"
          exit 1

      - name: Package
        shell: bash
        run: bash scripts/package-release.sh "${{ matrix.rust_target }}" "${{ matrix.asset_target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-restore-filemode-${{ matrix.asset_target }}
          path: dist/git-restore-filemode-${{ matrix.asset_target }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check package versions match release tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          cargo = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          python_package = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          node_package = json.loads(Path("package.json").read_text())["version"]
          versions = {
              "Cargo.toml": cargo,
              "pyproject.toml": python_package,
              "package.json": node_package,
          }
          mismatches = {
              name: version
              for name, version in versions.items()
              if version != expected
          }
          if mismatches:
              details = ", ".join(f"{name}={version}" for name, version in mismatches.items())
              raise SystemExit(f"release tag version is {expected}, but {details}")
          PY

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist-artifacts/*.tar.gz --clobber
          else
            gh release create "${RELEASE_TAG}" dist-artifacts/*.tar.gz \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Automated binary release for ${RELEASE_TAG}."
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: publish-release
    if: ${{ github.event_name == 'push' || inputs.publish_pypi }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/git-restore-filemode/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python package
        shell: bash
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish to npm
    needs: publish-release
    if: ${{ github.event_name == 'push' || inputs.publish_npm }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/git-restore-filemode
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        shell: bash
        run: |
          npm install -g npm@latest
          npm pack --dry-run
          npm publish
